name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job name is required by a Vercel Deployment Check: production is only
  # promoted after this passes. Renaming it means updating that check too.
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
